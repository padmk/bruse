name: release
on:
  push:
    tags: ["v*"]
  # A dry run: builds and checks everything a tag would, publishes nothing.
  workflow_dispatch:

# The build job runs the project's code, so it can read the repository and
# attest what it made, but not change releases or reach the tap. Only
# `publish` and `tap` write, and neither runs project code.
permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  package:
    # The zip package needs macOS's ditto.
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - name: The tag matches the release version
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p 'require("./browser/extension/manifest.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "$GITHUB_REF_NAME does not match the manifest's version $version" >&2; exit 1; }
      - name: Release notes from CHANGELOG.md
        # The section of this version, without its heading; a tag without one stops here.
        if: env.PUBLISH == 'true'
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          printf '\n## Install\n\nWith Homebrew on macOS or Linux:\n\n```sh\nbrew install %s/tap/bruse\nbruse setup\n```\n\nOr unpack `Bruse-%s.zip` below and double-click **Install Bruse.command**. See the README for details.\n' "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REF_NAME#v}" >> "$RUNNER_TEMP/notes.md"
      - name: Build the zip package
        run: |
          node installer/package.mjs
          mkdir out
          cp dist/Bruse-*.zip out/
          (cd out && shasum -a 256 Bruse-*.zip > checksums.txt)
          if [ -f "$RUNNER_TEMP/notes.md" ]; then cp "$RUNNER_TEMP/notes.md" out/notes.md; fi
      - name: Smoke-test the package as users get it
        # Unpacked, the installer's modules load and the server answers initialize.
        run: |
          t="$RUNNER_TEMP/unzipped"; mkdir -p "$t"
          ditto -x -k out/Bruse-*.zip "$t"
          cd "$t"/Bruse-*
          node --check installer/install.mjs
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | BROWSER_CONTROL_STATE_DIR="$RUNNER_TEMP/state" node browser/mcp/server.mjs | grep -q '"serverInfo"'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            out/Bruse-*.zip
            out/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error

  publish:
    # Creates the GitHub release from the built files; runs none of them.
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require a tested commit on main
        # The tag must point at a commit of main whose `ci` run passed; a run
        # still in progress is waited for.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in identical|behind) ;; *) echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main ($status)" >&2; exit 1;; esac
          for _ in $(seq 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "ci passed for $GITHUB_SHA"; exit 0;;
              completed*) echo "ci did not pass for $GITHUB_SHA: $run" >&2; exit 1;;
              ""|"null null") echo "no ci run for $GITHUB_SHA" >&2; exit 1;;
            esac
            sleep 30
          done
          echo "ci for $GITHUB_SHA did not finish in 30 minutes" >&2; exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release/notes.md release/Bruse-*.zip release/checksums.txt

  tap:
    # Publishes the formula to <owner>/homebrew-tap. The token lives in the
    # `release` environment, which only tags `v*` reach.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew
      - name: Update the Homebrew formula
        # Skipped until the tap token is set up for this repository.
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          # git asks gh for credentials, so the token stays out of URLs and git config.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The formula installs from the tag's source archive.
          curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          source_sha=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/__VERSION__/$version/" -e "s/__SOURCE_SHA256__/$source_sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            packaging/homebrew/bruse.rb.tmpl > tap/Formula/bruse.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bruse.rb
          git commit -m "bruse $version"
          git push
